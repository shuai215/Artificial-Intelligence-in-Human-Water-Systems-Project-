[data]
dataset_root = "../../data/green_roofs/green_roofs"
processed_root = "../../data/processed/green_roofs_2016_plz12357"
image_size = 256
augment_training = true

[model]
name = "segformer_b0"
checkpoint = "nvidia/mit-b0"
pretrained = true
num_classes = 1

[loss]
name = "bce_dice"
bce_weight = 0.5
dice_weight = 0.5

[sampling]
positive_tile_fraction = 0.5

[training]
seed = 42
batch_size = 4
num_workers = 0
epochs = 20
learning_rate = 0.0001
output_dir = "../../runs/segformer_b0_plz12357"
