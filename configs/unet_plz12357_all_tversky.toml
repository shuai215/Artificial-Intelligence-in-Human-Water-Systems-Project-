[data]
dataset_root = "../../data/green_roofs/green_roofs"
processed_root = "../../data/processed/green_roofs_2016_plz12357"
image_size = 256
augment_training = true

[model]
name = "exercise_resnet50_unet"
pretrained = true
num_classes = 1

[loss]
name = "tversky"
alpha = 0.3
beta = 0.7
smooth = 1.0

[sampling]
positive_tile_fraction = 0.5

[training]
seed = 42
batch_size = 4
num_workers = 0
epochs = 20
learning_rate = 0.0001
output_dir = "../../runs/unet_plz12357_all_tversky"
